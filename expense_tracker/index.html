<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My tools</title>
<style>
:root{--bg:#EDF1F3;--surface:#fff;--ink:#13212B;--muted:#586873;--line:#D3DCE1;--accent:#0E5A8A}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A21;--surface:#17262F;--ink:#E7EEF2;--muted:#93A5B0;--line:#294049;--accent:#5FB0E6}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px}
h1{font-size:28px;margin:0 0 20px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li+li{border-top:1px solid var(--line)}
a{display:block;padding:16px 18px;color:var(--ink);text-decoration:none}
a:hover{background:var(--bg)}a b{color:var(--accent)}a span{display:block;color:var(--muted);font-size:14px}
</style></head><body><main><h1>My tools</h1><ul>
<li><a href="expense_tracker/"><b>Expense tracker</b><span>Trip expenses, 6 to 14 Oct 2026, with receipts</span></a></li>
</ul></main></body></html>

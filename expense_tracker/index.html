<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#13212B; --muted:#586873; --line:#D3DCE1; --accent:#0E5A8A; --accent-ink:#FFFFFF; --danger:#B3261E;
  --c-food:#1F7A6B; --c-snacks:#C98F12; --c-travel:#3B5BA9; --c-shopping:#9A4D8E; --c-stay:#B5533C; --c-other:#6B7780;
  --shadow:0 1px 0 rgba(19,33,43,.04);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A21; --surface:#17262F; --ink:#E7EEF2; --muted:#93A5B0; --line:#294049; --accent:#5FB0E6; --accent-ink:#06222F; --danger:#FF8A80;
    --c-food:#4CC2AE; --c-snacks:#E8B547; --c-travel:#7C9BE0; --c-shopping:#CF8FC4; --c-stay:#E58A72; --c-other:#93A0A9;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A21; --surface:#17262F; --ink:#E7EEF2; --muted:#93A5B0; --line:#294049; --accent:#5FB0E6; --accent-ink:#06222F; --danger:#FF8A80;
  --c-food:#4CC2AE; --c-snacks:#E8B547; --c-travel:#7C9BE0; --c-shopping:#CF8FC4; --c-stay:#E58A72; --c-other:#93A0A9;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px 16px;box-shadow:var(--shadow)}
.summary h1{margin:0;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.01em}
.total{margin:2px 0 0;font-size:52px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.span{margin:4px 0 16px;color:var(--muted);font-size:14px}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;gap:2px;background:var(--line)}
.bar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);background:transparent;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip b{font-weight:600}

.grant{margin:14px 0 0}
.grant .left{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:16px}
.grant .left b{font-size:20px;font-weight:700}
.grant .left.over b{color:var(--danger)}
.grant .track{height:8px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.grant .fill{height:100%;background:var(--accent)}
.grant .fill.over{background:var(--danger)}
.grant .sub{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:500;text-decoration:underline}
.who{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.whohead{margin:0 0 6px;font-size:14px;color:var(--muted)}
.whorow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 10px;margin:0 -10px;width:calc(100% + 20px);border:0;border-radius:8px;background:none;text-align:left;font-size:16px}
.whorow[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.whorow b{font-weight:600}
.row .amt{text-align:right}
.by{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.day{margin:26px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.day h2{margin:0;font-size:17px;font-weight:600}
.day span{color:var(--muted);font-size:14px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item+.item{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 16px 14px 0}
.row .strip{align-self:stretch;border-radius:0 3px 3px 0}
.row .name{font-weight:600;font-size:16px}
.row .where{display:block;color:var(--muted);font-size:13.5px}
.row .amt{font-weight:600;font-size:17px;white-space:nowrap}
.detail{padding:0 16px 16px 20px;font-size:14.5px}
.detail dl{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.detail dt{color:var(--muted)}
.detail dd{margin:0}
.lines{list-style:none;margin:0 0 12px;padding:0;border-top:1px dashed var(--line)}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.acts{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.tools{margin-top:28px;display:flex;justify-content:center;gap:10px}
.note{margin:18px 4px 0;color:var(--muted);font-size:13.5px;text-align:center}

.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 65%,transparent)}
.dock .btn{display:block;width:100%;max-width:560px;margin:0 auto;padding:14px;font-size:16px;font-weight:600;border-radius:12px}

.rcpt{margin:0 0 12px;flex-wrap:wrap}
.vscrim{position:fixed;inset:0;background:rgba(8,16,22,.78);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.viewer{display:flex;flex-direction:column;width:100%;max-width:760px;height:100%;max-height:96vh;background:var(--surface);border-radius:14px;overflow:hidden}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.vname{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere;line-height:1.3}.vname b{color:var(--ink);font-size:14px}
.vbar a.btn{text-decoration:none;color:var(--ink)}
.vbody{flex:1;overflow:auto;background:var(--bg);display:flex;justify-content:center}
.vbody img{max-width:100%;height:auto;align-self:flex-start}
.vbody iframe{width:100%;height:100%;border:0}
.vmiss{padding:24px;color:var(--muted);text-align:center}
.scrim{position:fixed;inset:0;background:rgba(8,16,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 14px;font-size:20px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);min-height:1.3em;font-size:14px;margin:0 0 8px}
.sheet .acts{justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>

<script id="app-script">
(function(){
var CATS=[
  {id:'food',name:'Food & drink',color:'var(--c-food)'},
  {id:'snacks',name:'Snacks',color:'var(--c-snacks)'},
  {id:'travel',name:'Travel & fees',color:'var(--c-travel)'},
  {id:'shopping',name:'Shopping',color:'var(--c-shopping)'},
  {id:'stay',name:'Accommodation',color:'var(--c-stay)'},
  {id:'other',name:'Other',color:'var(--c-other)'}
];
var CAT={};CATS.forEach(function(c){CAT[c.id]=c;});
var state=JSON.parse(document.getElementById('state').textContent);
var viewing=null, artifact=null, dlCap=null, filter='all', payer='all', openId=null, editing=null, deleting=null, busy=false;
var app=document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var money=new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'});
function fmt(n){return money.format(Math.round(n*100)/100);}
function dayLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
function shortDay(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function sorted(){return state.expenses.slice().sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time);});}
function sum(list){return list.reduce(function(s,e){return s+e.amount;},0);}

function buildHtml(){
  var css=document.getElementById('app-style').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var head='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Trip expenses</title>'
    +'<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
    +'<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">'
    +'<style id="app-style">'+css+'<'+'/style>';
  return '<!doctype html>\n<html lang="en"><head>'+head+'</head><body><div id="app"></div>'
    +'<script id="state" type="application/json">'+json+'<'+'/script>'
    +'<script id="app-script">'+document.getElementById('app-script').textContent+'<'+'/script></body></html>';
}

function render(){
  var all=sorted(), total=sum(all);
  var byCat={};all.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});
  var vis=all.filter(function(e){return (filter==='all'||e.cat===filter)&&(payer==='all'||(e.by||'none')===payer);});
  var byPerson={};all.forEach(function(e){var k=e.by||'none';byPerson[k]=(byPerson[k]||0)+e.amount;});
  var h='<div class="wrap">';
  h+='<section class="summary"><h1>Trip expenses</h1><p class="total">'+fmt(total)+'</p>';
  var bud=Number(state.budget)||0;
  if(bud>0){
    var left=bud-total, pct=Math.min(100,total/bud*100), over=left<0;
    h+='<div class="grant"><div class="left'+(over?' over':'')+'"><span>'+(over?'Over the grant by':'Left from the grant')+'</span><b>'+fmt(Math.abs(left))+'</b></div>'
      +'<div class="track" role="img" aria-label="'+pct.toFixed(0)+'% of the grant spent"><div class="fill'+(over?' over':'')+'" style="width:'+pct.toFixed(1)+'%"></div></div>'
      +'<div class="sub"><span>'+pct.toFixed(0)+'% of '+fmt(bud)+' spent</span>'+(artifact?'<button class="link" data-act="budget">Change grant</button>':'')+'</div></div>';
  }
  if(all.length){
    var dates=all.map(function(e){return e.date;}).sort();
    var lo=dates[0], hi=dates[dates.length-1];
    if(state.period){if(state.period.start&&state.period.start<lo)lo=state.period.start;if(state.period.end&&state.period.end>hi)hi=state.period.end;}
    var range=lo===hi?shortDay(lo):shortDay(lo)+' to '+shortDay(hi);
    h+='<p class="span">'+all.length+(all.length===1?' expense':' expenses')+', '+range+'</p>';
    h+='<div class="bar" role="img" aria-label="Spending by category">';
    CATS.forEach(function(c){if(byCat[c.id])h+='<i style="width:'+(byCat[c.id]/total*100).toFixed(2)+'%;background:'+c.color+'" title="'+esc(c.name)+'"></i>';});
    h+='</div><div class="chips">';
    h+='<button class="chip" data-act="filter" data-f="all" aria-pressed="'+(filter==='all')+'">All</button>';
    CATS.forEach(function(c){if(byCat[c.id])h+='<button class="chip" data-act="filter" data-f="'+c.id+'" aria-pressed="'+(filter===c.id)+'"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+' <b>'+fmt(byCat[c.id])+'</b></button>';});
    h+='</div>';
    h+='<div class="who"><p class="whohead">Who paid</p>';
    Object.keys(byPerson).sort(function(a,b){if(a==='none')return 1;if(b==='none')return -1;return byPerson[b]-byPerson[a];}).forEach(function(k){
      h+='<button class="whorow" data-act="payer" data-p="'+esc(k)+'" aria-pressed="'+(payer===k)+'"><span>'+(k==='none'?'Not set':esc(k))+'</span><b>'+fmt(byPerson[k])+'</b></button>';
    });
    h+='</div>';
  } else h+='<p class="span">No expenses yet</p>';
  h+='</section>';

  if(!vis.length){h+='<p class="empty">'+(all.length?'Nothing in this category.':'Add your first expense to start tracking.')+'</p>';}
  var groups=[],gi={};
  vis.forEach(function(e){if(!(e.date in gi)){gi[e.date]=groups.length;groups.push({date:e.date,list:[]});}groups[gi[e.date]].list.push(e);});
  groups.forEach(function(g){
    h+='<div class="day"><h2>'+dayLabel(g.date)+'</h2><span>'+fmt(sum(g.list))+'</span></div><ul class="list">';
    g.list.forEach(function(e){
      var c=CAT[e.cat]||CAT.other, isOpen=openId===e.id;
      h+='<li class="item"><button class="row" data-act="toggle" data-id="'+e.id+'" aria-expanded="'+isOpen+'"><span class="strip" style="background:'+c.color+'"></span>'
        +'<span><span class="name">'+esc(e.merchant)+'</span><span class="where">'+[e.time,e.where].filter(Boolean).map(esc).join(', ')+'</span></span>'
        +'<span class="amt">'+fmt(e.amount)+'<span class="by">'+(e.by?esc(e.by):'Not set')+'</span></span></button>';
      if(isOpen){
        h+='<div class="detail">';
        if(e.items&&e.items.length){h+='<ul class="lines">'+e.items.map(function(it){return '<li><span>'+esc(it.n)+'</span><span>'+(it.a==null?'':fmt(it.a))+'</span></li>';}).join('')+'</ul>';}
        h+='<dl><dt>Category</dt><dd>'+esc(c.name)+'</dd><dt>Paid by</dt><dd>'+(e.by?esc(e.by):'Not set')+'</dd>';
        if(e.pay)h+='<dt>Paid with</dt><dd>'+esc(e.pay)+'</dd>';
        if(e.note)h+='<dt>Note</dt><dd>'+esc(e.note)+'</dd>';
        h+='</dl>';
        if(e.files&&e.files.length){
          h+='<div class="acts rcpt">'+e.files.map(function(f,i){return '<button class="btn" data-act="view" data-id="'+e.id+'" data-i="'+i+'">View receipt'+(e.files.length>1?' '+(i+1)+'/'+e.files.length:'')+'</button>';}).join('')+'</div>';
        }
        if(artifact){
          h+='<div class="acts"><button class="btn" data-act="edit" data-id="'+e.id+'">Edit</button>';
          if(deleting===e.id)h+='<button class="btn danger" data-act="confirmdel" data-id="'+e.id+'">Confirm delete</button><button class="btn" data-act="canceldel">Keep</button>';
          else h+='<button class="btn danger" data-act="del" data-id="'+e.id+'">Delete</button>';
          h+='</div>';
        }
        h+='</div>';
      }
      h+='</li>';
    });
    h+='</ul>';
  });
  if(all.length)h+='<div class="tools"><button class="btn" data-act="export">Export CSV</button></div>';
  if(!artifact)h+='<p class="note">Snapshot with receipts up to 22 Oct 2026. To add or edit expenses, use the online version.</p>';
  h+='</div>';
  if(artifact)h+='<div class="dock"><button class="btn primary" data-act="add">Add expense</button></div>';
  if(editing!==null)h+=(editing==='budget'?budgetSheet():sheet());
  if(viewing)h+=viewer();
  app.innerHTML=h;
}

function srcUrl(f){var b=state.srcBase||'src/';if(b.slice(-1)!=='/')b+='/';return b+encodeURIComponent(f);}
function viewer(){
  var ex=state.expenses.filter(function(x){return x.id===viewing.id;})[0]||{merchant:'',amount:0,files:[]};
  var f=viewing.file, u=srcUrl(f), pdf=/\.pdf$/i.test(f);
  return '<div class="vscrim" data-act="vclose"><div class="viewer" role="dialog" aria-modal="true" aria-label="Receipt"><div class="vbar"><span class="vname"><b>'+esc(ex.merchant)+', '+fmt(ex.amount)+'</b><br>'+esc(f)+'</span><a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">Open</a><button class="btn" data-act="vclose">Close</button></div>'
   +'<div class="vbody">'+(pdf?'<iframe class="rcpt" src="'+esc(u)+'" title="'+esc(f)+'"></iframe>':'<img class="rcpt" src="'+esc(u)+'" alt="Receipt '+esc(f)+'">')+'<p class="vmiss" hidden>Could not load this file. Check that <b>'+esc(f)+'</b> is in the <b>src</b> folder next to this page.</p></div></div></div>';
}
function budgetSheet(){
  return '<div class="scrim" data-act="scrim"><form class="sheet" id="fb" role="dialog" aria-modal="true" aria-label="Change grant">'
   +'<h2>Change grant</h2>'
   +'<label class="field"><span>Maximum grant (EUR)</span><input name="budget" type="number" inputmode="decimal" step="0.01" min="0" required value="'+esc(state.budget||'')+'"></label>'
   +'<p class="err" id="err" role="alert"></p>'
   +'<div class="acts"><button type="button" class="btn" data-act="cancel">Cancel</button><button type="submit" class="btn primary" id="save">Save</button></div>'
   +'</form></div>';
}
function names(){var o={};state.expenses.forEach(function(e){if(e.by)o[e.by]=1;});return Object.keys(o).sort();}
function sheet(){
  var e=editing==='new'?{date:new Date().toISOString().slice(0,10),time:new Date().toTimeString().slice(0,5),merchant:'',where:'',cat:'food',amount:'',by:'',pay:'',note:'',items:[]}:state.expenses.filter(function(x){return x.id===editing;})[0];
  var items=(e.items||[]).map(function(it){return it.n+(it.a==null?'':' | '+it.a);}).join('\n');
  return '<div class="scrim" data-act="scrim"><form class="sheet" id="f" role="dialog" aria-modal="true" aria-label="'+(editing==='new'?'Add expense':'Edit expense')+'">'
   +'<h2>'+(editing==='new'?'Add expense':'Edit expense')+'</h2>'
   +'<label class="field"><span>Merchant</span><input name="merchant" required value="'+esc(e.merchant)+'"></label>'
   +'<label class="field"><span>Location (optional)</span><input name="where" value="'+esc(e.where)+'"></label>'
   +'<div class="two"><label class="field"><span>Amount (EUR)</span><input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required value="'+esc(e.amount)+'"></label>'
   +'<label class="field"><span>Category</span><select name="cat">'+CATS.map(function(c){return '<option value="'+c.id+'"'+(c.id===e.cat?' selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</select></label></div>'
   +'<div class="two"><label class="field"><span>Date</span><input name="date" type="date" required value="'+esc(e.date)+'"></label>'
   +'<label class="field"><span>Time</span><input name="time" type="time" value="'+esc(e.time)+'"></label></div>'
   +'<label class="field"><span>Paid by</span><input name="by" list="people" autocomplete="off" value="'+esc(e.by)+'"><datalist id="people">'+names().map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist></label>'
   +'<label class="field"><span>Paid with (optional)</span><input name="pay" value="'+esc(e.pay)+'"></label>'
   +'<label class="field"><span>Items (optional), one per line as name | amount</span><textarea name="items">'+esc(items)+'</textarea></label>'
   +'<label class="field"><span>Receipt files in src/ (optional), separated by commas</span><input name="files" value="'+esc((e.files||[]).join(', '))+'"></label>'
   +'<label class="field"><span>Note (optional)</span><input name="note" value="'+esc(e.note)+'"></label>'
   +'<p class="err" id="err" role="alert"></p>'
   +'<div class="acts"><button type="button" class="btn" data-act="cancel">Cancel</button><button type="submit" class="btn primary" id="save">Save</button></div>'
   +'</form></div>';
}

function parseItems(t){
  return t.split('\n').map(function(l){return l.trim();}).filter(Boolean).map(function(l){
    var i=l.lastIndexOf('|');
    if(i<0)return {n:l,a:null};
    var a=parseFloat(l.slice(i+1).replace(',','.'));
    return {n:l.slice(0,i).trim(),a:isNaN(a)?null:a};
  });
}

async function commit(prev, errEl){
  busy=true;
  try{
    await artifact.publish(buildHtml());
  }catch(err){
    busy=false;
    state=JSON.parse(prev);
    var code=err&&err.code;
    if(code==='conflict')return;
    var msg=(code==='not_writer'||code==='not_granted')?'This view is read-only, so changes cannot be saved.':'Could not save. Try again in a moment.';
    if(code==='not_writer'||code==='not_granted')artifact=null;
    if(errEl){errEl.textContent=msg;var b=document.getElementById('save');if(b)b.disabled=false;}
    else{editing=null;render();}
    return;
  }
}

function toCsv(){
  var rows=[['Date','Time','Merchant','Location','Category','Amount (EUR)','Paid by','Paid with','Note','Receipt files','Items']];
  sorted().forEach(function(e){rows.push([e.date,e.time,e.merchant,e.where,(CAT[e.cat]||CAT.other).name,e.amount.toFixed(2),e.by||'',e.pay,e.note,(e.files||[]).join('; '),(e.items||[]).map(function(i){return i.n+(i.a==null?'':' '+i.a);}).join('; ')]);});
  return rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
}

app.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'), id=t.getAttribute('data-id');
  if(act==='scrim'&&ev.target!==t)return;
  if(act==='filter'){filter=t.getAttribute('data-f');render();}
  else if(act==='payer'){var pp=t.getAttribute('data-p');payer=payer===pp?'all':pp;render();}
  else if(act==='view'){var ex=state.expenses.filter(function(x){return x.id===id;})[0];if(ex&&ex.files)viewing={file:ex.files[parseInt(t.getAttribute('data-i'),10)||0],id:ex.id,i:parseInt(t.getAttribute('data-i'),10)||0};render();}
  else if(act==='vclose'){if(act==='vclose'&&t.classList.contains('vscrim')&&ev.target!==t)return;viewing=null;render();}
  else if(act==='toggle'){openId=openId===id?null:id;deleting=null;render();}
  else if(act==='add'){editing='new';render();}
  else if(act==='budget'){editing='budget';render();}
  else if(act==='edit'){editing=id;render();}
  else if(act==='cancel'||act==='scrim'){editing=null;render();}
  else if(act==='del'){deleting=id;render();}
  else if(act==='canceldel'){deleting=null;render();}
  else if(act==='confirmdel'){
    var prev=JSON.stringify(state);
    state.expenses=state.expenses.filter(function(e){return e.id!==id;});
    openId=null;deleting=null;render();
    commit(prev,null);
  }
  else if(act==='export'){if(dlCap){dlCap.save({filename:'trip-expenses.csv',data:toCsv()}).catch(function(){});}else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([toCsv()],{type:'text/csv'}));a.download='trip-expenses.csv';document.body.appendChild(a);a.click();a.remove();}}
});

document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&viewing){viewing=null;render();}});
app.addEventListener('error',function(ev){var t=ev.target;if(t&&t.classList&&t.classList.contains('rcpt')&&t.tagName==='IMG'){t.hidden=true;var m=app.querySelector('.vmiss');if(m)m.hidden=false;}},true);
app.addEventListener('submit',function(ev){
  if(ev.target.id==='fb'){
    ev.preventDefault();
    if(busy||!artifact)return;
    var b=parseFloat(ev.target.elements.budget.value.replace(',','.')), e2=document.getElementById('err');
    if(!(b>=0)){e2.textContent='Enter an amount of 0 or more.';return;}
    var pv=JSON.stringify(state);
    state.budget=Math.round(b*100)/100;
    document.getElementById('save').disabled=true;
    document.getElementById('save').textContent='Saving';
    commit(pv,e2);
    return;
  }
  if(ev.target.id!=='f')return;
  ev.preventDefault();
  if(busy||!artifact)return;
  var f=ev.target, v=function(n){return f.elements[n].value.trim();};
  var amount=parseFloat(v('amount').replace(',','.')), err=document.getElementById('err');
  if(!v('merchant')){err.textContent='Enter a merchant.';return;}
  if(!(amount>0)){err.textContent='Enter an amount greater than 0.';return;}
  if(!v('date')){err.textContent='Choose a date.';return;}
  var rec={id:editing==='new'?'e'+Date.now().toString(36):editing,date:v('date'),time:v('time'),merchant:v('merchant'),where:v('where'),by:v('by'),cat:v('cat'),amount:Math.round(amount*100)/100,pay:v('pay'),note:v('note'),files:v('files').split(',').map(function(x){return x.trim();}).filter(Boolean),items:parseItems(f.elements.items.value)};
  var prev=JSON.stringify(state);
  if(editing==='new')state.expenses.push(rec);
  else state.expenses=state.expenses.map(function(e){return e.id===rec.id?rec:e;});
  document.getElementById('save').disabled=true;
  document.getElementById('save').textContent='Saving';
  openId=rec.id;
  commit(prev,err);
});

render();
if(window.claude&&claude.use){
  claude.use('artifact').then(function(a){artifact=a;if(editing===null)render();}).catch(function(){});
  claude.use('downloads').then(function(d){dlCap=d;if(editing===null)render();}).catch(function(){});
}
})();
</script></body></html>

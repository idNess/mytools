*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

button{cursor:pointer}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px 16px;box-shadow:var(--shadow)}

<script id="app-script">
(function(){
var CATS=[
  {id:'food',name:'Food & drink',color:'var(--c-food)'},
  {id:'snacks',name:'Snacks',color:'var(--c-snacks)'},
  {id:'travel',name:'Travel & fees',color:'var(--c-travel)'},
  {id:'shopping',name:'Shopping',color:'var(--c-shopping)'},
  {id:'stay',name:'Accommodation',color:'var(--c-stay)'},
  {id:'other',name:'Other',color:'var(--c-other)'}
];
var CAT={};CATS.forEach(function(c){CAT[c.id]=c;});
var state=JSON.parse(document.getElementById('state').textContent);
var openSet={}, viewing=null, artifact=null, dlCap=null, filter='all', payer='all', openId=null, editing=null, deleting=null, busy=false;
var app=document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var money=new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'});
function fmt(n){return money.format(Math.round(n*100)/100);}
function dayLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
function shortDay(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function sorted(){return state.expenses.slice().sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time);});}
function sum(list){return list.reduce(function(s,e){return s+e.amount;},0);}

function buildHtml(){
  var css=document.getElementById('app-style').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var head='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(state.title||'Trip expenses')+', Expense tracker</title>'
    +'<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
    +'<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">'
    +'<style id="app-style">'+css+'<'+'/style>';
  return '<!doctype html>\n<html lang="en"><head>'+head+'</head><body><div id="app"></div>'
    +'<script id="state" type="application/json">'+json+'<'+'/script>'
    +'<script id="app-script">'+document.getElementById('app-script').textContent+'<'+'/script></body></html>';
}

function render(){
  var all=sorted(), total=sum(all);
  var byCat={};all.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});
  var vis=all.filter(function(e){return (filter==='all'||e.cat===filter)&&(payer==='all'||(e.by||'none')===payer);});
  var byPerson={};all.forEach(function(e){var k=e.by||'none';byPerson[k]=(byPerson[k]||0)+e.amount;});
  var h='<div class="wrap">';
  h+='<section class="summary">'+brandHtml()+crumbs()+'<h1>Expense tracker</h1><h2>'+esc(state.title||'Trip expenses')+'</h2>'+aboutHtml()+'<p class="total">'+fmt(total)+'</p>';
  var bud=Number(state.budget)||0;
  if(bud>0){
    var left=bud-total, pct=Math.min(100,total/bud*100), over=left<0;
    h+='<div class="grant"><div class="left'+(over?' over':'')+'"><span>'+(over?'Over the grant by':'Left from the grant')+'</span><b>'+fmt(Math.abs(left))+'</b></div>'
      +'<div class="track" role="img" aria-label="'+pct.toFixed(0)+'% of the grant spent"><div class="fill'+(over?' over':'')+'" style="width:'+pct.toFixed(1)+'%"></div></div>'
      +'<div class="sub"><span>'+pct.toFixed(0)+'% of '+fmt(bud)+' spent</span>'+''+'</div></div>';
  }
  if(all.length){
    var dates=all.map(function(e){return e.date;}).sort();
    var lo=dates[0], hi=dates[dates.length-1];
    if(state.period){if(state.period.start&&state.period.start<lo)lo=state.period.start;if(state.period.end&&state.period.end>hi)hi=state.period.end;}
    var range=lo===hi?shortDay(lo):shortDay(lo)+' to '+shortDay(hi);
    h+='<p class="span">'+all.length+(all.length===1?' expense':' expenses')+', '+range+'</p>';
    h+='<div class="bar" role="img" aria-label="Spending by category">';
    CATS.forEach(function(c){if(byCat[c.id])h+='<i style="width:'+(byCat[c.id]/total*100).toFixed(2)+'%;background:'+c.color+'" title="'+esc(c.name)+'"></i>';});
    h+='</div><div class="chips">';
    h+='<button class="chip" data-act="filter" data-f="all" aria-pressed="'+(filter==='all')+'">All</button>';
    CATS.forEach(function(c){if(byCat[c.id])h+='<button class="chip" data-act="filter" data-f="'+c.id+'" aria-pressed="'+(filter===c.id)+'"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+' <b>'+fmt(byCat[c.id])+'</b></button>';});
    h+='</div>';
    h+='<div class="who"><p class="whohead">Who paid</p>';
    Object.keys(byPerson).sort(function(a,b){if(a==='none')return 1;if(b==='none')return -1;return byPerson[b]-byPerson[a];}).forEach(function(k){
      h+='<button class="whorow" data-act="payer" data-p="'+esc(k)+'" aria-pressed="'+(payer===k)+'"><span>'+(k==='none'?'Not set':esc(k))+'</span><b>'+fmt(byPerson[k])+'</b></button>';
    });
    h+='</div>';
  } else h+='<p class="span">No expenses yet</p>';
  h+='</section>';

  if(!vis.length){h+='<p class="empty">'+(all.length?'Nothing in this category.':'Add your first expense to start tracking.')+'</p>';}
  if(vis.length){var everyOpen=vis.every(function(e){return openSet[e.id];});h+='<div class="listbar"><button class="btn" data-act="expall">'+(everyOpen?'Collapse all':'Expand all')+'</button></div>';}
  var groups=[],gi={};
  vis.forEach(function(e){if(!(e.date in gi)){gi[e.date]=groups.length;groups.push({date:e.date,list:[]});}groups[gi[e.date]].list.push(e);});
  groups.forEach(function(g){
    h+='<div class="day"><h2>'+dayLabel(g.date)+'</h2><span>'+fmt(sum(g.list))+'</span></div><ul class="list">';
    g.list.forEach(function(e){
      var c=CAT[e.cat]||CAT.other, isOpen=!!openSet[e.id];
      h+='<li class="item"><button class="row" data-act="toggle" data-id="'+e.id+'" aria-expanded="'+isOpen+'"><span class="strip" style="background:'+c.color+'"></span>'
        +'<span><span class="name">'+esc(e.merchant)+(e.warn?WARN:'')+'</span><span class="where"><b class="xid">'+xid(e)+'</b> '+[e.time,e.where].filter(Boolean).map(esc).join(', ')+'</span></span>'
        +'<span class="amt">'+fmt(e.amount)+'<span class="by">'+(e.by?esc(e.by):'Not set')+'</span></span></button>';
      if(isOpen){
        h+='<div class="detail">';
        if(e.items&&e.items.length){h+='<ul class="lines">'+e.items.map(function(it){return '<li><span>'+esc(it.n)+'</span><span>'+(it.a==null?'':fmt(it.a))+'</span></li>';}).join('')+'</ul>';}
        if(e.warn)h+='<div class="warnbox" role="note"><b>'+WARN+'Please read</b><p>'+esc(e.warn)+'</p></div>';
        h+='<dl><dt>Expense ID</dt><dd><b class="xid">'+xid(e)+'</b></dd><dt>Category</dt><dd>'+esc(c.name)+'</dd><dt>Paid by</dt><dd>'+(e.by?esc(e.by):'Not set')+'</dd>';
        if(e.pay)h+='<dt>Paid with</dt><dd>'+esc(e.pay)+'</dd>';
        if(e.note)h+='<dt>Note</dt><dd>'+esc(e.note)+'</dd>';
        h+='</dl>';
        if(e.files&&e.files.length){
          h+='<div class="acts rcpt">'+e.files.map(function(f,i){return '<button class="btn" data-act="view" data-id="'+e.id+'" data-i="'+i+'">View receipt'+(e.files.length>1?' '+(i+1)+'/'+e.files.length:'')+'</button>';}).join('')+'</div>';
        }
        if(false){
          h+='<div class="acts"><button class="btn" data-act="edit" data-id="'+e.id+'">Edit</button>';
          if(deleting===e.id)h+='<button class="btn danger" data-act="confirmdel" data-id="'+e.id+'">Confirm delete</button><button class="btn" data-act="canceldel">Keep</button>';
          else h+='<button class="btn danger" data-act="del" data-id="'+e.id+'">Delete</button>';
          h+='</div>';
        }
        h+='</div>';
      }
      h+='</li>';
    });
    h+='</ul>';
  });
  var hasFiles=state.expenses.some(function(e){return e.files&&e.files.length;}), tl='';
  if(all.length&&(dlCap||!artifact))tl+='<button class="btn" data-act="export"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg> Export CSV</button>';
  if(hasFiles)tl+='<button class="btn" data-act="dlall"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg> Download all receipts (.zip)</button>';
  if(tl)h+='<div class="tools">'+tl+'</div>';
  h+='<p class="foot">Kindly developed by Vanessa Cicognani ✨ and released under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA</a>.</p>';
  h+='</div>';
  
  if(editing!==null)h+=(editing==='budget'?budgetSheet():sheet());
  if(viewing)h+=viewer();
  app.innerHTML=h;
}

function aboutHtml(){return '<p class="about">Pilot Light expense tracker for the Portugal tour (Fake It Tour), 6 to 10 October 2026: Esmoriz and Lisbon, with shows at Uncle Joe\'s, Casa de Pedra and Patio do Sol. Every receipt posted by the crew is listed here, with who paid, and counted against the Kultur | lx grant.</p>'
 +'<div class="support"><span>Supported by</span>'+LK_HTML+'</div>'
 +'<details class="guide"><summary>User guide</summary><ul>'
 +'<li><b>Top card:</b> total spent, what is left from the grant, and the split by category and by person.</li>'
 +'<li><b>Filters:</b> tap a category or a name to show only those expenses. Tap again, or "All", to clear.</li>'
 +'<li><b>Expenses:</b> tap one to open its details. Use "Expand all" to open every expense at once.</li>'
 +'<li><b>View receipt:</b> opens the photo or PDF of the receipt linked to that expense.</li>'
 +'<li><b>Warning triangle:</b> the expense has a note to read, for example the flights home after the trip.</li>'
 +'<li><b>Expense ID:</b> every expense has a number like #012, shown in the list and in its details. Quote it when you ask about an expense, for example if it is not paid back.</li>'
 +'<li><b>Export CSV:</b> downloads the list as a spreadsheet.</li>'
 +'<li><b>Download all receipts:</b> downloads every receipt in one .zip file.</li>'
 +'</ul></details>';}

function srcUrl(f){var b=hosted()?'src/':(state.srcBase||'src/');if(b.slice(-1)!=='/')b+='/';return b+encodeURIComponent(f);}

function saveBlob(b,name){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
function crc32(buf){var T=crc32.T;if(!T){T=crc32.T=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0;}}var r=0xFFFFFFFF;for(var i=0;i<buf.length;i++)r=T[(r^buf[i])&255]^(r>>>8);return (r^0xFFFFFFFF)>>>0;}
function makeZip(files){
  var enc=new TextEncoder(),parts=[],cen=[],off=0;
  files.forEach(function(f){
    var nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    var l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(12,0x21,true);l.setUint32(14,crc,true);l.setUint32(18,sz,true);l.setUint32(22,sz,true);l.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(l.buffer),nm,f.data);
    var c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+sz;
  });
  var cs=0;cen.forEach(function(x){cs+=x.length;});
  var e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(e.buffer)]),{type:'application/zip'});
}
var dlBusy=false;
async function downloadAll(btn){
  if(dlBusy)return;dlBusy=true;
  var seen={},list=[];
  sorted().slice().reverse().forEach(function(e){(e.files||[]).forEach(function(f){if(!seen[f]){seen[f]=1;list.push(f);}});});
  var label=btn.innerHTML,done=0,failed=[],out=new Array(list.length);
  btn.disabled=true;
  var idx=0;
  async function worker(){
    while(idx<list.length){
      var i=idx++;
      try{var r=await fetch(srcUrl(list[i]));if(!r.ok)throw new Error(r.status);out[i]={name:'receipts/'+list[i],data:new Uint8Array(await r.arrayBuffer())};}
      catch(err){failed.push(list[i]);}
      done++;btn.textContent='Downloading '+done+' of '+list.length;
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  var ok=out.filter(Boolean);
  if(ok.length)saveBlob(makeZip(ok),'receipts.zip');
  btn.disabled=false;
  if(failed.length)btn.textContent=ok.length?'Done, '+failed.length+' file(s) missing':'Could not download receipts';else btn.innerHTML=label;
  if(failed.length)setTimeout(function(){btn.innerHTML=label;},6000);
  dlBusy=false;
}

function parseItems(t){
  return t.split('\n').map(function(l){return l.trim();}).filter(Boolean).map(function(l){
    var i=l.lastIndexOf('|');
    if(i<0)return {n:l,a:null};
    var a=parseFloat(l.slice(i+1).replace(',','.'));
    return {n:l.slice(0,i).trim(),a:isNaN(a)?null:a};
  });
}

async function commit(prev, errEl){
  busy=true;
  try{
    await artifact.publish(buildHtml());
  }catch(err){
    busy=false;
    state=JSON.parse(prev);
    var code=err&&err.code;
    if(code==='conflict')return;
    var msg=(code==='not_writer'||code==='not_granted')?'This view is read-only, so changes cannot be saved.':'Could not save. Try again in a moment.';
    if(code==='not_writer'||code==='not_granted')artifact=null;
    if(errEl){errEl.textContent=msg;var b=document.getElementById('save');if(b)b.disabled=false;}
    else{editing=null;render();}
    return;
  }
}

function toCsv(){
  var rows=[['ID','Date','Time','Merchant','Location','Category','Amount (EUR)','Paid by','Paid with','Note','Receipt files','Items']];
  sorted().forEach(function(e){rows.push([xid(e),e.date,e.time,e.merchant,e.where,(CAT[e.cat]||CAT.other).name,e.amount.toFixed(2),e.by||'',e.pay,e.note,(e.files||[]).join('; '),(e.items||[]).map(function(i){return i.n+(i.a==null?'':' '+i.a);}).join('; ')]);});
  return rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
}

app.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'), id=t.getAttribute('data-id');
  if(act==='scrim'&&ev.target!==t)return;
  if(act==='filter'){filter=t.getAttribute('data-f');render();}
  else if(act==='payer'){var pp=t.getAttribute('data-p');payer=payer===pp?'all':pp;render();}
  else if(act==='view'){var ex=state.expenses.filter(function(x){return x.id===id;})[0];if(ex&&ex.files)viewing={file:ex.files[parseInt(t.getAttribute('data-i'),10)||0],id:ex.id,i:parseInt(t.getAttribute('data-i'),10)||0};render();}
  else if(act==='vclose'){if(act==='vclose'&&t.classList.contains('vscrim')&&ev.target!==t)return;viewing=null;render();}
  else if(act==='toggle'){if(openSet[id])delete openSet[id];else openSet[id]=true;deleting=null;render();}
  else if(act==='expall'){var allOpen=sorted().length&&visibleIds().every(function(i){return openSet[i];});if(allOpen)openSet={};else visibleIds().forEach(function(i){openSet[i]=true;});deleting=null;render();}
  else if(act==='add'){editing='new';render();}
  else if(act==='budget'){editing='budget';render();}
  else if(act==='edit'){editing=id;render();}
  else if(act==='cancel'||act==='scrim'){editing=null;render();}
  else if(act==='del'){deleting=id;render();}
  else if(act==='canceldel'){deleting=null;render();}
  else if(act==='confirmdel'){
    var prev=JSON.stringify(state);
    state.expenses=state.expenses.filter(function(e){return e.id!==id;});
    delete openSet[id];deleting=null;render();
    commit(prev,null);
  }
  else if(act==='export'){if(dlCap){dlCap.save({filename:'trip-expenses.csv',data:toCsv()}).catch(function(){});}else{saveBlob(new Blob([toCsv()],{type:'text/csv'}),'trip-expenses.csv');}}
  else if(act==='dlall'){downloadAll(t);}
});

document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&viewing){viewing=null;render();}});

app.addEventListener('submit',function(ev){
  if(ev.target.id==='fb'){
    ev.preventDefault();
    if(busy||!artifact)return;
    var b=parseFloat(ev.target.elements.budget.value.replace(',','.')), e2=document.getElementById('err');
    if(!(b>=0)){e2.textContent='Enter an amount of 0 or more.';return;}
    var pv=JSON.stringify(state);
    state.budget=Math.round(b*100)/100;
    document.getElementById('save').disabled=true;
    document.getElementById('save').textContent='Saving';
    commit(pv,e2);
    return;
  }
  if(ev.target.id!=='f')return;
  ev.preventDefault();
  if(busy||!artifact)return;
  var f=ev.target, v=function(n){return f.elements[n].value.trim();};
  var amount=parseFloat(v('amount').replace(',','.')), err=document.getElementById('err');
  if(!v('merchant')){err.textContent='Enter a merchant.';return;}
  if(!(amount>0)){err.textContent='Enter an amount greater than 0.';return;}
  if(!v('date')){err.textContent='Choose a date.';return;}
  var rec={id:editing==='new'?'e'+Date.now().toString(36):editing,date:v('date'),time:v('time'),merchant:v('merchant'),where:v('where'),by:v('by'),cat:v('cat'),amount:Math.round(amount*100)/100,pay:v('pay'),note:v('note'),warn:f.elements.warn.value.trim(),files:v('files').split(',').map(function(x){return x.trim();}).filter(Boolean),items:parseItems(f.elements.items.value)};
  var prev=JSON.stringify(state);
  if(editing==='new')state.expenses.push(rec);
  else state.expenses=state.expenses.map(function(e){return e.id===rec.id?rec:e;});
  document.getElementById('save').disabled=true;
  document.getElementById('save').textContent='Saving';
  openSet[rec.id]=true;
  commit(prev,err);
});

render();
if(window.claude&&claude.use){

}
